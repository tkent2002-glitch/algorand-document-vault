version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.72.0 requires TypeScript <6.1.0.
      # Revisit this ceiling when the lint toolchain supports newer TypeScript.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3