name: Alpha usability feedback
description: Tell us where a workflow was confusing, slow, or difficult to complete
title: "[Alpha feedback] "
labels:
  - enhancement
  - alpha-feedback
body:
  - type: markdown
    attributes:
      value: |
        Your feedback helps make notarization and verification easier to understand.

        **Do not attach original documents, document fingerprints, verification links, wallet addresses, signed transactions, private keys, seed phrases, or backup passwords.**
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow you were trying to complete
      options:
        - Notarize a document
        - Verify on the same device
        - Create and share a verification link
        - Verify on another device with a shared link
        - Back up or restore the Vault
        - Connect or reconnect Pera Wallet
        - Find evidence in the Vault
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to accomplish?
      placeholder: Describe the result you expected to reach.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Where did the experience become unclear?
      placeholder: Tell us the step, wording, control, or result that caused confusion.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What did you expect to happen next?
    validations:
      required: true
  - type: dropdown
    id: completion
    attributes:
      label: Were you able to finish the task?
      options:
        - Yes, without help
        - Yes, after retrying or getting help
        - "No"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 151 on Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed documents, fingerprints, proof links, wallet information, secrets, and backup passwords from this report.
          required: true
