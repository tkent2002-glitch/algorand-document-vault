name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked content
        run: npm run verify:tracked-content

      - name: Verify dependency tree
        run: npm ls --all --depth=0

      - name: Audit production dependencies
        run: npm run security:production

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Check release diff whitespace
        run: git diff --check

  browser-and-artifact:
    name: Browser matrix and release artifact
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox, and WebKit matrix
        run: npm run test:browser:ci

      - name: Package and smoke-test release artifact
        run: npm run test:artifact

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: algorand-document-vault-public-alpha-${{ github.sha }}
          path: release/algorand-document-vault-public-alpha
          if-no-files-found: error
          retention-days: 14
